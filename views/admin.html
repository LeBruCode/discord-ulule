<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<h1>Discord Access Dashboard</h1>

<div class="stats">
<div>Total: <span id="total"></span></div>
<div>Sent: <span id="sent"></span></div>
<div>Activated: <span id="activated"></span></div>
<div>Activation rate: <span id="rate"></span></div>
</div>

<div class="actions">
<button onclick="sendAll()">Send All Emails</button>
<button onclick="deleteAll()">Delete All</button>
<button onclick="deleteSelected()">Delete Selected</button>
<button onclick="exportCsv()">Export Activated</button>
</div>

<form method="POST" action="/admin/import">
<textarea name="emails" rows="6" placeholder="paste emails"></textarea>
<button>Import Emails</button>
</form>

<table>
<thead>
<tr>
<th></th>
<th>Email</th>
<th>Sent</th>
<th>Activated</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<div class="pager">
<button onclick="prev()">Prev</button>
<span id="pageInfo"></span>
<button onclick="next()">Next</button>
</div>

<script src="/js/admin.js"></script>
</body>
</html>
