<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Discord Access Dashboard</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="layout">

<header>
<h1>Discord Access</h1>
</header>

<section class="stats">
<div class="card"><span>Total</span><b id="total">0</b></div>
<div class="card"><span>Sent</span><b id="sent">0</b></div>
<div class="card"><span>Activated</span><b id="activated">0</b></div>
<div class="card"><span>Rate</span><b id="rate">0%</b></div>
</section>

<div class="progress"><div id="bar"></div></div>

<section class="controls">

<textarea id="emails" placeholder="paste emails"></textarea>

<div class="buttons">
<button id="importBtn">Import</button>
<button id="sendBtn">Send Emails</button>
</div>

<input id="search" placeholder="Search email">

<select id="status">
<option value="all">All</option>
<option value="sent">Sent</option>
<option value="activated">Activated</option>
</select>

<select id="limit">
<option value="50">50</option>
<option value="250">250</option>
<option value="500">500</option>
</select>

</section>

<table>
<thead>
<tr>
<th>Email</th>
<th>Sent</th>
<th>Activated</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

<div class="pagination">
<button id="prevBtn">Prev</button>
<span id="page">1</span>
<button id="nextBtn">Next</button>
</div>

</div>

<script src="/js/app.js"></script>

</body>
</html>
