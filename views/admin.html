<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Discord Access</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="container">

<h1>Discord Access Dashboard</h1>

<div class="stats">
<div class="card"><span>Total</span><b id="total">0</b></div>
<div class="card"><span>Sent</span><b id="sent">0</b></div>
<div class="card"><span>Activated</span><b id="activated">0</b></div>
<div class="card"><span>Rate</span><b id="rate">0%</b></div>
</div>

<div class="progress"><div id="bar"></div></div>

<textarea id="emails" placeholder="paste emails"></textarea>

<div class="buttons">
<button onclick="importEmails()">Import</button>
<button onclick="sendEmails()">Send Emails</button>
</div>

<h2>Email list</h2>

<div class="controls">
<select id="limit" onchange="changeLimit()">
<option value="50">50</option>
<option value="250">250</option>
<option value="500">500</option>
</select>
</div>

<table>
<thead>
<tr>
<th>Email</th>
<th>Sent</th>
<th>Activated</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

<div class="pagination">
<button onclick="prev()">Prev</button>
<span id="page">1</span>
<button onclick="next()">Next</button>
</div>

<pre id="log"></pre>

</div>

<script src="/js/app.js"></script>

</body>
</html>
